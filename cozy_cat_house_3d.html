<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cozy House with GLB Kitty</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      background-color: #000;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #333;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      pointer-events: none;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: #2c3e50;
    }
    p {
      font-size: 0.9rem;
      color: #555;
    }
    #action-prompt {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.9);
      color: #fff;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>
  <!-- Three.js and GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <h1>Cozy Living Room</h1>
    <p><strong>WASD / Arrow Keys</strong> : Move</p>
    <p><strong>Click & Drag</strong> : Look Around</p>
    <p><strong>Click Kitty</strong> : Pet / Interact</p>
  </div>

  <div id="crosshair"></div>
  <div id="action-prompt">Click to pet the kitty! 🐾</div>

  <script>
    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0e6d2);
    scene.fog = new THREE.FogExp2(0xf0e6d2, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 3); // Eye-level height

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.7);
    scene.add(ambientLight);

    const warmLight = new THREE.PointLight(0xffaa55, 1.2, 12);
    warmLight.position.set(0, 3, 0);
    warmLight.castShadow = true;
    scene.add(warmLight);

    const windowLight = new THREE.DirectionalLight(0xffffff, 0.8);
    windowLight.position.set(5, 4, -4);
    windowLight.castShadow = true;
    scene.add(windowLight);

    // --- House / Room Construction ---
    const roomGroup = new THREE.Group();

    // Floor
    const floorGeo = new THREE.PlaneGeometry(10, 10);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.4 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    roomGroup.add(floor);

    // Walls
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xede0d4, roughness: 0.8 });

    function createWall(w, h, d, x, y, z) {
      const wallGeo = new THREE.BoxGeometry(w, h, d);
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.position.set(x, y, z);
      wall.receiveShadow = true;
      wall.castShadow = true;
      roomGroup.add(wall);
    }

    createWall(10, 4, 0.2, 0, 2, -5); // Back
    createWall(0.2, 4, 10, -5, 2, 0); // Left
    createWall(0.2, 4, 10, 5, 2, 0);  // Right
    createWall(10, 4, 0.2, 0, 2, 5);  // Front

    // Ceiling
    const ceilingGeo = new THREE.PlaneGeometry(10, 10);
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
    ceiling.position.y = 4;
    ceiling.rotation.x = Math.PI / 2;
    roomGroup.add(ceiling);

    // Furniture: Carpet
    const rugGeo = new THREE.PlaneGeometry(4, 3);
    const rugMat = new THREE.MeshStandardMaterial({ color: 0xd98880, roughness: 0.9 });
    const rug = new THREE.Mesh(rugGeo, rugMat);
    rug.rotation.x = -Math.PI / 2;
    rug.position.set(0, 0.01, 0);
    rug.receiveShadow = true;
    roomGroup.add(rug);

    // Furniture: Sofa
    const sofaMat = new THREE.MeshStandardMaterial({ color: 0x5d6d7e });
    const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(3, 0.5, 1.2), sofaMat);
    sofaBase.position.set(0, 0.25, -3.8);
    sofaBase.castShadow = true;
    sofaBase.receiveShadow = true;
    roomGroup.add(sofaBase);

    const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 0.4), sofaMat);
    sofaBack.position.set(0, 0.8, -4.2);
    sofaBack.castShadow = true;
    roomGroup.add(sofaBack);

    // Furniture: Table
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 1), tableMat);
    tableTop.position.set(0, 0.6, -1.8);
    tableTop.castShadow = true;
    tableTop.receiveShadow = true;
    roomGroup.add(tableTop);

    const legGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.6);
    [[-0.8, -1.4], [0.8, -1.4], [-0.8, -2.2], [0.8, -2.2]].forEach(([lx, lz]) => {
      const leg = new THREE.Mesh(legGeo, tableMat);
      leg.position.set(lx, 0.3, lz);
      leg.castShadow = true;
      roomGroup.add(leg);
    });

    scene.add(roomGroup);

    // --- Kitty GLB Model Management ---
    const catContainer = new THREE.Group();
    scene.add(catContainer);

    let stillModel = null;
    let movingModel = null;
    let stillMixer = null;
    let movingMixer = null;

    const gltfLoader = new THREE.GLTFLoader();

    // Load KittyStill.glb
    gltfLoader.load('KittyStill.glb', (gltf) => {
      stillModel = gltf.scene;
      stillModel.traverse((c) => { if (c.isMesh) c.castShadow = true; });
      catContainer.add(stillModel);

      // Play GLB animation if embedded
      if (gltf.animations && gltf.animations.length > 0) {
        stillMixer = new THREE.AnimationMixer(stillModel);
        stillMixer.clipAction(gltf.animations[0]).play();
      }
    }, undefined, (err) => console.log('KittyStill.glb not found locally yet. Put it in the same folder as this file.'));

    // Load KittyMoving.glb
    gltfLoader.load('KittyMoving.glb', (gltf) => {
      movingModel = gltf.scene;
      movingModel.traverse((c) => { if (c.isMesh) c.castShadow = true; });
      movingModel.visible = false; // Hidden by default
      catContainer.add(movingModel);

      // Play GLB animation if embedded
      if (gltf.animations && gltf.animations.length > 0) {
        movingMixer = new THREE.AnimationMixer(movingModel);
        movingMixer.clipAction(gltf.animations[0]).play();
      }
    }, undefined, (err) => console.log('KittyMoving.glb not found locally yet. Put it in the same folder as this file.'));

    // --- Controls & Movement Logic ---
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    let isMouseDown = false;
    let yaw = 0, pitch = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) isMouseDown = true;
    });
    window.addEventListener('mouseup', () => isMouseDown = false);
    window.addEventListener('mousemove', (e) => {
      if (isMouseDown) {
        yaw -= e.movementX * 0.003;
        pitch -= e.movementY * 0.003;
        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
      }
    });

    // --- Kitty AI & Animation State ---
    let kittyState = 'IDLE'; // IDLE, WALKING, PURRING
    let targetPos = new THREE.Vector3();
    let stateTimer = 0;
    let walkSpeed = 0.02;

    function pickNewTarget() {
      targetPos.x = (Math.random() - 0.5) * 7;
      targetPos.z = (Math.random() - 0.5) * 7;
      kittyState = 'WALKING';
    }

    // Switch model visibility based on motion
    function updateKittyVisibility() {
      if (kittyState === 'WALKING') {
        if (movingModel) movingModel.visible = true;
        if (stillModel) stillModel.visible = false;
      } else {
        if (stillModel) stillModel.visible = true;
        if (movingModel) movingModel.visible = false;
      }
    }

    // Interactive Raycasting for Petting
    const raycaster = new THREE.Raycaster();
    const actionPrompt = document.getElementById('action-prompt');

    window.addEventListener('click', () => {
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObject(catContainer, true);
      if (intersects.length > 0) {
        kittyState = 'PURRING';
        stateTimer = 180;
        actionPrompt.textContent = "Meow! 😸 (Kitty liked that!)";
        actionPrompt.style.opacity = '1';
        setTimeout(() => { actionPrompt.style.opacity = '0'; }, 2000);
      }
    });

    // --- Main Game Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Update GLTF animation mixers if present
      if (stillMixer && stillModel && stillModel.visible) stillMixer.update(delta);
      if (movingMixer && movingModel && movingModel.visible) movingMixer.update(delta);

      // Camera Look
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      // Player Movement Physics
      const moveSpeed = 0.08;
      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
      const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

      if (keys['KeyW'] || keys['ArrowUp']) camera.position.addScaledVector(forward, moveSpeed);
      if (keys['KeyS'] || keys['ArrowDown']) camera.position.addScaledVector(forward, -moveSpeed);
      if (keys['KeyA'] || keys['ArrowLeft']) camera.position.addScaledVector(side, -moveSpeed);
      if (keys['KeyD'] || keys['ArrowRight']) camera.position.addScaledVector(side, moveSpeed);

      // Room Boundaries
      camera.position.x = Math.max(-4.2, Math.min(4.2, camera.position.x));
      camera.position.z = Math.max(-4.2, Math.min(4.2, camera.position.z));

      // Model Switch Update
      updateKittyVisibility();

      // Kitty Movement Logic
      if (kittyState === 'IDLE') {
        stateTimer--;
        if (stateTimer <= 0) {
          pickNewTarget();
        }
      } else if (kittyState === 'WALKING') {
        const dir = new THREE.Vector3().subVectors(targetPos, catContainer.position);
        dir.y = 0;
        const dist = dir.length();

        if (dist < 0.2) {
          kittyState = 'IDLE';
          stateTimer = Math.floor(Math.random() * 200) + 100;
        } else {
          dir.normalize();
          catContainer.position.addScaledVector(dir, walkSpeed);
          
          // Face the direction of travel
          const targetAngle = Math.atan2(dir.x, dir.z);
          catContainer.rotation.y = THREE.MathUtils.lerp(catContainer.rotation.y, targetAngle, 0.1);
        }
      } else if (kittyState === 'PURRING') {
        stateTimer--;
        if (stateTimer <= 0) {
          kittyState = 'IDLE';
          stateTimer = 60;
        }
      }

      renderer.render(scene, camera);
    }

    // Handle Window Resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
